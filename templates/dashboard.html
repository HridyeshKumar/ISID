<!DOCTYPE html>
<html>
<head>
    <title>ISID Dashboard</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body style="background:#f5f7fa;">

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand">📊 ISID Dashboard</span>
    <a href="/home" class="btn btn-outline-light">⬅ Home</a>
</nav>

<div class="container mt-4">

<h2 class="text-center mb-4">Analytics Overview</h2>

<div class="row">

    <!-- STATE CHART -->
    <div class="col-md-6">
        <div class="card p-3 shadow-sm">
            <h5 class="text-center">Projects by State</h5>
            <canvas id="stateChart"></canvas>
        </div>
    </div>

    <!-- CATEGORY CHART -->
    <div class="col-md-6">
        <div class="card p-3 shadow-sm">
            <h5 class="text-center">Projects by Category</h5>
            <canvas id="categoryChart"></canvas>
        </div>
    </div>

</div>

</div>

<!-- DATA -->
<script type="application/json" id="stateData">{{ state_data | tojson }}</script>
<script type="application/json" id="categoryData">{{ category_data | tojson }}</script>

<script>
    const stateData = JSON.parse(document.getElementById('stateData').textContent);
    const categoryData = JSON.parse(document.getElementById('categoryData').textContent);

    // FIX: handle null values safely
    const stateLabels = stateData.map(item => item.state || "Unknown");
    const stateValues = stateData.map(item => item.count);

    const categoryLabels = categoryData.map(item => item.category || "Unknown");
    const categoryValues = categoryData.map(item => item.count);

    // STATE CHART
    new Chart(document.getElementById("stateChart"), {
        type: 'bar',
        data: {
            labels: stateLabels,
            datasets: [{
                label: 'Projects by State',
                data: stateValues
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: { display: false }
            }
        }
    });

    // CATEGORY CHART
    new Chart(document.getElementById("categoryChart"), {
        type: 'bar',
        data: {
            labels: categoryLabels,
            datasets: [{
                label: 'Projects by Category',
                data: categoryValues
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: { display: false }
            }
        }
    });
</script>

</body>
</html>
